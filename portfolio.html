<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AARAV SHARMA | Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
    /* =========================================
   AI RESUME PORTFOLIO — PREMIUM DESIGN
   ========================================= */

:root {
    --bg: #080b16;
    --bg-soft: #0d1222;
    --card: rgba(255, 255, 255, 0.055);
    --card-border: rgba(255, 255, 255, 0.10);

    --text: #f5f7ff;
    --text-soft: #aab3ca;

    --primary: #6d7cff;
    --primary-light: #8d98ff;
    --secondary: #a855f7;

    --max-width: 1120px;

    --radius: 20px;
    --transition: 0.3s ease;
}

/* =========================================
   RESET
   ========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;

    background:
        radial-gradient(circle at 50% -10%, rgba(109, 124, 255, 0.22), transparent 35%),
        var(--bg);

    color: var(--text);
    line-height: 1.7;
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

.container {
    width: min(var(--max-width), calc(100% - 48px));
    margin: 0 auto;
}

/* =========================================
   NAVBAR
   ========================================= */

.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    background: rgba(8, 11, 22, 0.72);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.nav-container {
    min-height: 76px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: -0.5px;

    transition: var(--transition);
}

.logo:hover {
    color: var(--primary-light);
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 28px;
}

.nav-links a {
    position: relative;

    color: var(--text-soft);
    font-size: 0.92rem;
    font-weight: 500;

    transition: var(--transition);
}

.nav-links a::after {
    content: "";

    position: absolute;
    left: 0;
    bottom: -8px;

    width: 0;
    height: 2px;

    background: var(--primary-light);

    transition: var(--transition);
}

.nav-links a:hover {
    color: var(--text);
}

.nav-links a:hover::after {
    width: 100%;
}

/* =========================================
   HERO
   ========================================= */

.hero {
    min-height: calc(100vh - 76px);

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    position: relative;
    overflow: hidden;

    background:
        radial-gradient(circle at 50% 45%,
            rgba(109, 124, 255, 0.17),
            transparent 34%),
        radial-gradient(circle at 20% 80%,
            rgba(168, 85, 247, 0.10),
            transparent 30%);
}

.hero::before {
    content: "";

    position: absolute;

    width: 520px;
    height: 520px;

    border-radius: 50%;

    background: rgba(109, 124, 255, 0.08);

    filter: blur(90px);

    top: 20%;
    left: 50%;

    transform: translateX(-50%);
}

.hero-content {
    position: relative;
    z-index: 2;

    animation: heroReveal 0.9s ease both;
}

.hero-label {
    margin-bottom: 20px;

    color: var(--primary-light);

    font-size: 0.78rem;
    font-weight: 700;

    letter-spacing: 5px;
    text-transform: uppercase;
}

.hero h1 {
    font-size: clamp(3.5rem, 9vw, 7rem);

    line-height: 0.95;
    letter-spacing: -5px;

    font-weight: 900;

    background:
        linear-gradient(
            120deg,
            #ffffff 20%,
            #cdd3ff 50%,
            #8d98ff 80%
        );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    margin-bottom: 28px;
}

.headline {
    color: var(--text-soft);

    font-size: clamp(1.1rem, 2vw, 1.4rem);

    max-width: 700px;
    margin: 0 auto 38px;
}

.hero-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 14px 26px;

    border-radius: 12px;

    background: linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );

    color: white;

    font-weight: 700;

    box-shadow:
        0 12px 30px rgba(109, 124, 255, 0.25);

    transition:
        transform var(--transition),
        box-shadow var(--transition);
}

.hero-button:hover {
    transform: translateY(-4px);

    box-shadow:
        0 18px 40px rgba(109, 124, 255, 0.38);
}

/* =========================================
   SECTIONS
   ========================================= */

.section {
    padding: 120px 0;
}

.section-alt {
    background: rgba(255, 255, 255, 0.018);

    border-top: 1px solid rgba(255, 255, 255, 0.035);
    border-bottom: 1px solid rgba(255, 255, 255, 0.035);
}

.section-label {
    margin-bottom: 14px;

    color: var(--primary-light);

    font-size: 0.75rem;
    font-weight: 700;

    letter-spacing: 4px;
    text-transform: uppercase;
}

.section h2 {
    font-size: clamp(2.3rem, 5vw, 4rem);

    line-height: 1.05;
    letter-spacing: -2px;

    margin-bottom: 42px;
}

/* =========================================
   ABOUT
   ========================================= */

.about-text {
    max-width: 820px;

    color: var(--text-soft);

    font-size: 1.2rem;
    line-height: 1.9;
}

/* =========================================
   SKILLS
   ========================================= */

.skills {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
}

.skill {
    display: inline-flex;
    align-items: center;

    padding: 10px 18px;

    border: 1px solid var(--card-border);
    border-radius: 999px;

    background: var(--card);

    color: #dfe3ff;

    font-size: 0.92rem;
    font-weight: 600;

    backdrop-filter: blur(10px);

    transition: var(--transition);
}

.skill:hover {
    transform: translateY(-4px);

    border-color: rgba(141, 152, 255, 0.5);

    background: rgba(109, 124, 255, 0.12);

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.2);
}

/* =========================================
   PROJECTS
   ========================================= */

.projects-grid {
    display: grid;

    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 24px;
}

.project-card {
    position: relative;

    padding: 30px;

    min-height: 260px;

    border: 1px solid var(--card-border);
    border-radius: var(--radius);

    background:
        linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.075),
            rgba(255, 255, 255, 0.025)
        );

    backdrop-filter: blur(16px);

    overflow: hidden;

    transition:
        transform var(--transition),
        border-color var(--transition),
        box-shadow var(--transition);
}

.project-card::before {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    top: -90px;
    right: -90px;

    border-radius: 50%;

    background: rgba(109, 124, 255, 0.15);

    filter: blur(30px);
}

.project-card:hover {
    transform: translateY(-8px);

    border-color: rgba(141, 152, 255, 0.35);

    box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.3);
}

.project-card h3 {
    position: relative;

    margin-bottom: 14px;

    font-size: 1.4rem;
}

.project-card p {
    position: relative;

    color: var(--text-soft);

    margin-bottom: 12px;
}

.project-card strong {
    color: var(--text);
}

.project-card a {
    position: relative;

    display: inline-block;

    margin-top: 12px;

    color: var(--primary-light);

    font-weight: 700;
}

.project-card a:hover {
    text-decoration: underline;
}

/* =========================================
   EDUCATION
   ========================================= */

.education-list,
.experience-list,
.achievements-list {
    display: grid;
    gap: 18px;
}

.education-card,
.experience-card,
.achievement-card {
    padding: 26px 28px;

    border: 1px solid var(--card-border);
    border-radius: var(--radius);

    background: var(--card);

    backdrop-filter: blur(12px);

    transition: var(--transition);
}

.education-card:hover,
.experience-card:hover,
.achievement-card:hover {
    transform: translateX(6px);

    border-color: rgba(141, 152, 255, 0.3);
}

.education-card h3,
.experience-card h3 {
    margin-bottom: 8px;

    font-size: 1.25rem;
}

.education-card p,
.experience-card p,
.achievement-card p {
    color: var(--text-soft);

    margin-bottom: 5px;
}

/* =========================================
   CONTACT
   ========================================= */

.contact-section {
    text-align: center;

    background:
        radial-gradient(
            circle at 50% 100%,
            rgba(109, 124, 255, 0.12),
            transparent 40%
        );
}

.contact-content {
    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 14px;
}

.contact-content p {
    margin: 0;
}

.contact-content a {
    display: inline-flex;

    padding: 12px 20px;

    border-radius: 12px;

    border: 1px solid var(--card-border);

    background: var(--card);

    color: var(--text-soft);

    transition: var(--transition);
}

.contact-content a:hover {
    color: white;

    background: rgba(109, 124, 255, 0.12);

    border-color: rgba(141, 152, 255, 0.4);

    transform: translateY(-3px);
}

/* =========================================
   FOOTER
   ========================================= */

footer {
    padding: 30px 0;

    border-top: 1px solid rgba(255, 255, 255, 0.07);

    text-align: center;

    color: #68718a;

    font-size: 0.85rem;
}

/* =========================================
   ANIMATION
   ========================================= */

@keyframes heroReveal {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================================
   RESPONSIVE
   ========================================= */

@media (max-width: 800px) {

    .container {
        width: min(var(--max-width), calc(100% - 32px));
    }

    .nav-container {
        min-height: 68px;
    }

    .nav-links {
        gap: 14px;

        overflow-x: auto;

        max-width: 70%;
    }

    .nav-links a {
        font-size: 0.8rem;

        white-space: nowrap;
    }

    .hero {
        min-height: calc(100vh - 68px);
    }

    .hero h1 {
        letter-spacing: -3px;
    }

    .section {
        padding: 80px 0;
    }

    .projects-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 520px) {

    .nav-container {
        align-items: flex-start;

        padding: 16px 0;

        gap: 14px;
    }

    .nav-links {
        max-width: 62%;

        gap: 12px;
    }

    .hero-label {
        letter-spacing: 3px;
    }

    .hero h1 {
        font-size: 3.3rem;
        letter-spacing: -2px;
    }

    .headline {
        font-size: 1rem;
    }

    .section h2 {
        font-size: 2.4rem;
    }

    .project-card,
    .education-card,
    .experience-card,
    .achievement-card {
        padding: 22px;
    }
}
</style>
</head>
